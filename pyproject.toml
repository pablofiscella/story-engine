[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "story-engine"
version = "0.1.0"
description = "Motor de historias infantiles: planifica, escribe, ilustra, narra y publica."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pablo Fiscella" }]

# El core NO depende de ninguna IA, base de datos ni framework web: solo de Pydantic.
# Esa es la regla — el dominio no sabe que existe OpenAI, Postgres ni FastAPI.
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
